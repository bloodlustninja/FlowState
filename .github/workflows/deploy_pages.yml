name: "Deploy FlowState to GitHub Pages"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export_web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Web Export Environment
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          if [ -d "/root/.local/share/godot/templates/4.3.stable" ]; then
            cp -rv /root/.local/share/godot/templates/4.3.stable ~/.local/share/godot/export_templates/
          fi
          if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            cp -rv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi
          echo "Export templates directory contents:"
          ls -la ~/.local/share/godot/export_templates/4.3.stable/ || true
          mkdir -v -p build/web

      - name: Headless Editor Asset Import
        run: |
          godot -v --headless --editor --quit || true

      - name: Export Godot 4 HTML5 Web Build
        run: |
          godot -v --headless --export-release "Web" build/web/index.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export_web
    runs-on: ubuntu-latest
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
